services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: home-library-service-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/homelibrarydb?schema=public
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db
      - home-library-network

  db:
    build:
      context: ./src/database
      dockerfile: Dockerfile
    container_name: home-library-service-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: homelibrarydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - home-library-network

volumes:
  postgres_data:

networks:
  home-library-network:
    driver: bridge